# Local development stack. Source is bind-mounted, so edits hot-reload.
#   docker compose -f compose.dev.yml up --build
# Frontend: http://<host>:${WEB_PORT:-3010}   Scraper API: http://<host>:${SCRAPER_PORT:-5010}
name: bolaget-dev

services:
  web:
    build:
      context: apps/web
      dockerfile: Dockerfile.dev
    env_file:
      - path: .env
        required: false
    environment:
      API_URL: http://scraper:5000
      # The Unraid /mnt/user share is FUSE; inotify events do not reach the container.
      WATCHPACK_POLLING: "true"
    ports:
      - "${WEB_PORT:-3010}:3000"
    volumes:
      - ./apps/web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    depends_on:
      - scraper
    restart: unless-stopped

  scraper:
    build:
      context: apps/scraper
      dockerfile: Dockerfile.dev
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "5000"
      NODE_ENV: development
    ports:
      - "${SCRAPER_PORT:-5010}:5000"
    volumes:
      - ./apps/scraper:/app
      - scraper_node_modules:/app/node_modules
    shm_size: 1gb
    restart: unless-stopped

volumes:
  web_node_modules:
  web_next:
  scraper_node_modules:

name: build-deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: build-deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      scraper: ${{ steps.filter.outputs.scraper }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            web:
              - 'apps/web/**'
            scraper:
              - 'apps/scraper/**'
            deploy:
              - 'compose.prod.yml'
              - 'deploy/**'

  build:
    needs: changes
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: web
            image: bolaget-web
          - app: scraper
            image: stock-scraper
    steps:
      - name: Skip unchanged app
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ needs.changes.outputs[matrix.app] }}" = "true" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: docker/setup-buildx-action@v3
        if: steps.gate.outputs.run == 'true'
      - uses: docker/login-action@v3
        if: steps.gate.outputs.run == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        if: steps.gate.outputs.run == 'true'
        with:
          context: apps/${{ matrix.app }}
          platforms: linux/arm64
          push: true
          tags: |
            ghcr.io/j4ck3/${{ matrix.image }}:latest
            ghcr.io/j4ck3/${{ matrix.image }}:sha-${{ steps.gate.outputs.short_sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

  deploy:
    needs: [changes, build]
    if: >-
      github.event_name == 'workflow_dispatch' ||
      needs.changes.outputs.web == 'true' ||
      needs.changes.outputs.scraper == 'true' ||
      needs.changes.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Deploy to web host
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o BatchMode=yes "ubuntu@$HOST" "$GITHUB_SHA"
